function probeAudio(src, ms){
  return new Promise(res => {
    let done = false;
    const fin = ok => { if (!done){ done = true; res(ok); } };
    try {
      const a = new Audio();
      const to = setTimeout(() => fin(false), ms || 2500);
      a.addEventListener('canplaythrough', () => { clearTimeout(to); fin(true); }, { once: true });
      a.addEventListener('error', () => { clearTimeout(to); fin(false); }, { once: true });
      a.preload = 'auto';
      a.src = src;
    } catch(e){ fin(false); }
  });
}
function probeImage(src, ms){
  return new Promise(res => {
    let done = false;
    const fin = ok => { if (!done){ done = true; res(ok); } };
    try {
      const im = new Image();
      const to = setTimeout(() => fin(false), ms || 2500);
      im.onload = () => { clearTimeout(to); fin(true); };
      im.onerror = () => { clearTimeout(to); fin(false); };
      im.src = src;
    } catch(e){ fin(false); }
  });
}

function loadManifest(){
  const names = a => (Array.isArray(a) ? a : []).filter(e => e && e.type === 'file').map(e => e.name);
  return (async () => {
    try {
      const repo = 'https://api.github.com/repos/TotallyNotHappey/abouthappey/contents/';
      const res = await Promise.all([
        fetch(repo + 'assets/images').then(r => r.ok ? r.json() : []),
        fetch(repo + 'assets/music').then(r => r.ok ? r.json() : []),
        fetch(repo + 'assets/sounds').then(r => r.ok ? r.json() : []),
        fetch(repo + 'assets/images/documents').then(r => r.ok ? r.json() : [])
      ]);
      const m = { images: names(res[0]), music: names(res[1]), sounds: names(res[2]),
        documents: names(res[3]).map(n => 'documents/' + n) };
      if (m.images.length || m.music.length || m.sounds.length || m.documents.length) return m;
    } catch(e){}
    try {
      const r = await fetch('manifest.json');
      if (r.ok){
        const j = await r.json();
        if (j && (j.images || j.music || j.sounds || j.documents)) return j;
      }
    } catch(e){}
    return null;
  })();
}
function applyManifest(m){
  if (!m) return;
  if (m.documents) DOC_FILES = m.documents.filter(n => /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(n));
  const isImg = n => /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(n);
  const isAud = n => /\.(mp3|wav|ogg)$/i.test(n);
  const gal = nodeAt(['Home', 'Images']);
  if (gal && m.images){
    const listed = {};
    m.images.filter(isImg).forEach(nm => { listed[nm] = true; });
    Object.keys(gal.children).forEach(k => { if (gal.children[k].t === 'img' && !listed[k]) delete gal.children[k]; });
    Object.keys(listed).forEach(nm => { if (!gal.children[nm]) gal.children[nm] = { t: 'img' }; });
  }
  const mus = nodeAt(['Home', 'Music']);
  if (mus && m.music){
    const listed = {};
    m.music.filter(isAud).forEach(nm => { listed[nm] = true; });
    Object.keys(mus.children).forEach(k => { if (mus.children[k].t === 'mp3' && !listed[k]) delete mus.children[k]; });
    Object.keys(listed).forEach(nm => { if (!mus.children[nm]) mus.children[nm] = { t: 'mp3', m: Date.now() }; });
  }
  fsSave();
}

function resolveDir(base, input){
  let parts = (input || '').trim().replace(/\\/g, '/');
  if (!parts) return null;
  if (parts === '~') return ['Home'];
  let out;
  if (parts[0] === '/'){ out = []; parts = parts.slice(1); }
  else if (/^~\//.test(parts)){ out = ['Home']; parts = parts.slice(2); }
  else if (/^home(\/|$)/i.test(parts)){ out = []; }
  else out = base.slice();
  for (const seg of parts.split('/')){
    if (!seg || seg === '.') continue;
    if (seg === '..'){ if (out.length) out.pop(); continue; }
    const node = nodeAt(out);
    if (!node || !node.children) return null;
    const hit = Object.keys(node.children).find(k => k.toLowerCase() === seg.toLowerCase() && node.children[k].t === 'dir');
    if (!hit) return null;
    out.push(hit);
  }
  return out;
}
function resolveFile(base, input){
  const parts = (input || '').trim().replace(/\\/g, '/');
  if (!parts) return null;
  const i = parts.lastIndexOf('/');
  const dir = i === -1 ? base.slice() : resolveDir(base, parts.slice(0, i));
  const name = i === -1 ? parts : parts.slice(i + 1);
  if (!dir || !name) return null;
  const node = nodeAt(dir);
  if (!node || !node.children) return null;
  const hit = Object.keys(node.children).find(k => k.toLowerCase() === name.toLowerCase());
  return hit ? node.children[hit] : null;
}
function uniqueName(dir, base){
  if (!dir.children[base]) return base;
  const dot = base.lastIndexOf('.');
  const stem = dot > 0 ? base.slice(0, dot) : base;
  const ext = dot > 0 ? base.slice(dot) : '';
  let i = 2;
  while (dir.children[stem + ' (' + i + ')' + ext]) i++;
  return stem + ' (' + i + ')' + ext;
}

function doPaste(destPath){
  if (!CLIP) return false;
  const dest = nodeAt(destPath);
  if (!dest || dest.ro) return false;
  const src = nodeAt(CLIP.from);
  const entry = src && src.children && src.children[CLIP.name];
  if (!entry) return false;
  if (entry.sys) return false;
  if (CLIP.mode === 'cut'){
    if (CLIP.from.join('/') === destPath.join('/')) return false;
    delete src.children[CLIP.name];
    entry.m = Date.now();
    dest.children[uniqueName(dest, CLIP.name)] = entry;
    CLIP = null;
  } else {
    dest.children[uniqueName(dest, CLIP.name)] = JSON.parse(JSON.stringify(entry));
  }
  fsSave();
  return true;
}

    ox = r.left - p.left; oy = r.top - p.top;
    handle.setPointerCapture(e.pointerId);
  });

    if (!on) return;

    try {

      logs.forEach(l => kprint(l, 'kdim'));
      kprint(r === undefined ? 'undefined' : String(r), r === undefined ? 'kdim' : 'kgreen');
    } catch(e1) {
      try {
        new Function('console', '"use strict"; ' + code)(c);
        logs.forEach(l => kprint(l, 'kdim'));
        if (!logs.length) kprint('-- ok (no output)', 'kdim');
      } catch(e2){ kprint(e2.name + ': ' + e2.message, 'kred'); }

  const cmd = raw => {

      sudo.n++;
      if (sudo.n < 3){ kprint('Sorry, try again.', 'kred'); }
      else { kprint('happey is not in the sudoers file. This incident will be reported.', 'kred'); sudo = null; }
      promptEl.textContent = sudo ? '[sudo] password for happey: ' : P();
      input.type = sudo ? 'password' : 'text';
      return;
    }
    if (!t) return;
    hist.push(t); hi = hist.length;
    const sp = t.indexOf(' ');
    const c = (sp === -1 ? t : t.slice(0, sp)).toLowerCase();
    const a = sp === -1 ? '' : t.slice(sp + 1).trim();
    if (c === 'help') help();
    else if (c === 'fastfetch' || c === 'neofetch') ff();
    else if (c === 'js' || c === 'javascript') runJS(a);
    else if (c === 'clear' || c === 'cls') out.innerHTML = '';
    else if (c === 'kill' || c === 'exit' || c === 'logout') shut();
    else if (c === 'sudo'){
      if (!a) kprint('usage: sudo <command>', 'kdim');
      else { sudo = { n: 0 }; promptEl.textContent = '[sudo] password for happey: '; input.type = 'password'; kprint('[sudo] password for happey: (any password will be rejected)', 'kdim'); }
    }
    else if (c === 'ls' || c === 'dir'){
      const target = a ? resolveDir(cwd, a) : cwd.slice();
      const node = target && nodeAt(target);
      if (!node || !node.children) kprint('ls: cannot access \'' + a + '\': No such file or directory', 'kred');
      else kprint(Object.keys(node.children).map(n => n + (node.children[n].t === 'dir' ? '/' : '')).join('   ') || '(empty)', 'kcyan');
    }

    else if (c === 'whoami') kprint('happey');

    else if (c === 'cat'){
      if (!a){ kprint('usage: cat <file>', 'kred'); return; }
      const f = resolveFile(cwd, a) || fsFind(a);
      if (!f){ kprint('cat: ' + a + ': No such file or directory', 'kred'); return; }

      if (f.t !== 'txt'){ kprint('cat: ' + a + ': binary file — open Files to view', 'kdim'); return; }
      kprint(f.c || '', '');
    }
    else if (c === 'cd'){
      if (!a) cwd = ['Home'];
      else {
        const dest = resolveDir(cwd, a);
        if (!dest || !nodeAt(dest)) kprint('bash: cd: ' + a + ': No such file or directory', 'kred');
        else cwd = dest.length ? dest : ['Home'];
      }
      promptEl.textContent = P();
    }
    else if (c === 'date') kprint(new Date().toString());
    else if (c === 'uname') kprint('Linux potassium 6.7.4 x86_64 GNU/Linux');
    else if (c === 'history') hist.forEach((h, i) => kprint('  ' + i + '  ' + h, 'kdim'));
    else if (c === 'msg'){
      if (!a) kprint('usage: msg <your message>', 'kdim');
      else {
        kprint('Sending...', 'kdim');
        sendHappeyMsg(a).then(r => kprint(r.info, r.ok ? 'kgreen' : 'kred'));
      }
    }
    else kprint('bash: ' + c + ': command not found', 'kred');
  };
  input.addEventListener('keydown', e => {
    if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter') sfx('text', 0.15);
    if (e.key === 'Enter'){ const v = input.value; echo(sudo ? '********' : v); input.value = ''; cmd(v); b.scrollTop = b.scrollHeight; }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); if (hist.length && hi > 0){ hi--; input.value = hist[hi] || ''; } }

  });

  setTimeout(() => input.focus(), 300);
}

  b.querySelectorAll('.dside div').forEach(x => x.addEventListener('click', () => { sfx('click'); nav(SIDES[x.getAttribute('data-p')]); }));

  btns.del.addEventListener('click', () => {
    const dir = curNode();
    if (dir.ro || !sel || !dir.children[sel] || dir.children[sel].sys) return;
    sfx(dir.children[sel].t === 'dir' ? 'delperm' : 'del');

    sel = null; commit(); show();
  });
  show();
  if (arg.edit && sel){
    const n = curNode().children[sel];
    if (n && n.t === 'txt') openEditor(sel);
  }

function collectImgs(){
  const out = [];
  const walk = node => {
    Object.keys(node.children || {}).forEach(k => {
      const n = node.children[k];
      if (n.t === 'img'){ if (out.indexOf(k) === -1) out.push(k); }
      else if (n.t === 'dir') walk(n);
    });
  };
  walk(FS);
  return out;
}

  const many = v => Array.isArray(v) ? v.map(String).filter(Boolean) : (v === undefined || v === null || v === '' ? [] : [String(v)]);
  return {
    rows: [['Species', one(raw.species)], ['Pronouns', one(raw.pronouns)], ['Gender', one(raw.gender)], ['Sexuality', one(raw.sexuality)], ['Aliases', many(raw.aliases).join(', ')]].filter(r => r[1]),
    flags: (Array.isArray(raw.flag) ? raw.flag.map(String) : String(raw.flag || '').split(/[\/,]/).map(s => s.trim())).filter(Boolean),
    relations: many(raw.relations)
  };
}

function mountAbout(w){ mountCards(w, CARDS, 'card:', { hideCount: true }); }
function mountCards(w, cards, prefix, opts){
  opts = opts || {};
  const b = w.body;
  b.innerHTML = '<div class="about">' + (opts.chrome === false ? '' : '<div class="asearch"><input placeholder="' + (opts.search || 'Search cards and menus') + '"><button>Sort: Default</button></div>')
    + '<div class="acount"></div><div class="alist' + (opts.listClass ? ' ' + opts.listClass : '') + '"></div></div>';
  const inp = b.querySelector('input'), btn = b.querySelector('button');
  const list = b.querySelector('.alist'), cnt = b.querySelector('.acount');
  let sort = 'Default', q = '';
  const draw = () => {
    let L = cards.filter(c => !q || c.title.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q));
    if (sort === 'A-Z') L = L.slice().sort((x, y) => x.title.localeCompare(y.title));
    if (sort === 'Z-A') L = L.slice().sort((x, y) => y.title.localeCompare(x.title));
    if (opts.hideCount) cnt.style.display = 'none'; else cnt.textContent = L.length + ' ' + (opts.count || 'cards');
    let h = '';
    const secs = [];
    cards.forEach(c => { if (secs.indexOf(c.section) === -1) secs.push(c.section); });
    secs.forEach(sec => {
      const s = L.filter(c => c.section === sec);
      if (!s.length) return;
      h += '<div class="asec">' + sec + '</div><div class="agrid">';
      s.forEach(c => { h += '<div class="acard" data-k="' + c.section + '|' + c.title + '"><div class="t">' + c.title + '</div><div class="s">' + c.sub + '</div></div>'; });
      h += '</div>';
    });
    list.innerHTML = h || '<div style="color:#666;margin-top:10px;">No matches.</div>';
    list.querySelectorAll('.acard').forEach(el => {
      el.addEventListener('mouseenter', () => sfx('hover', 0.22));
      el.addEventListener('click', () => {
      const parts = (el.getAttribute('data-k') || '').split('|');
      const c = cards.find(x => x.section === parts[0] && x.title === parts[1]) || cards.find(x => x.title === el.getAttribute('data-k'));
      if (!c) return;
      sfx('click');
      openWin(prefix + c.section + ':' + c.title, { title: c.title, icon: opts.icon || 'assets/icons/about.svg', card: c.title, bio: c.title, sec: c.section, size: opts.size || [440, 320] });
      });
    });
  };
  if (inp) inp.addEventListener('input', () => { q = inp.value.toLowerCase(); draw(); });
  if (btn) btn.addEventListener('click', () => {
    sort = sort === 'Default' ? 'A-Z' : sort === 'A-Z' ? 'Z-A' : 'Default';
    btn.textContent = 'Sort: ' + sort; draw();
  });
  draw();
}

  let hist = [], hi = -1;
  [['Happey', 'happey.local'],
   ['GitHub', 'https://github.com/TotallyNotHappey/abouthappey'],
   ['Example', 'https://example.com'],
   ['Wikipedia', 'https://www.wikipedia.org']
  ].forEach(([t, u]) => {

  });
  function norm(u){
    u = (u || '').trim();
    if (!u) return null;
    if (/^happey\.local\/?$/i.test(u)) return 'happey.local';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?(\/\S*)?$/i.test(u)) return 'https://' + u;
    return 'https://duckduckgo.com/?q=' + encodeURIComponent(u);

    frame.style.display = el === frame ? 'block' : 'none';
    local.style.display = el === local ? 'block' : 'none';
  }
  function go(u, push){
    const url = norm(u);
    if (!url) return;
    if (push !== false){
      hist = hist.slice(0, hi + 1);

      hi = hist.length - 1;

function mountPaint(w){
  const b = w.body;
  b.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;background:#f0f0f0;">'
    + '<div class="fbar"><button data-p="brush">Brush</button><button data-p="eraser">Eraser</button><button data-p="fill">Fill</button>'
    + '<button data-p="clear">Clear</button><button data-p="save">Save</button><span style="flex:1"></span>'
    + '<input type="range" min="1" max="40" value="5" style="width:90px;align-self:center;">'
    + '<input type="color" value="#000000" style="width:34px;height:26px;padding:0;border:1px solid #999;cursor:pointer;align-self:center;"></div>'
    + '<div class="pwrap" style="flex:1;overflow:hidden;background:#808080;padding:8px;min-height:0;"><canvas style="width:100%;height:100%;background:#fff;display:block;cursor:crosshair;touch-action:none;"></canvas></div></div>';
  const cv = b.querySelector('canvas'), cx = cv.getContext('2d');
  const wrap = b.querySelector('.pwrap');
  function fit(){
    const W = Math.max(50, wrap.clientWidth - 16), H = Math.max(50, wrap.clientHeight - 16);
    if (cv.width === W && cv.height === H) return;
    const tmp = document.createElement('canvas');
    tmp.width = cv.width; tmp.height = cv.height;
    try { tmp.getContext('2d').drawImage(cv, 0, 0); } catch(e){}
    cv.width = W; cv.height = H;
    cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, W, H);
    try { cx.drawImage(tmp, 0, 0); } catch(e){}
  }
  fit();
  try { new ResizeObserver(() => fit()).observe(wrap); } catch(e){}
  let tool = 'brush', color = '#000000', size = 5, drawing = false, last = null;
  const btns = {};
  b.querySelectorAll('.fbar button[data-p]').forEach(x => { btns[x.getAttribute('data-p')] = x; });
  const pick = t => {
    tool = t;
    ['brush', 'eraser', 'fill'].forEach(k => { btns[k].style.background = k === t ? '#cce8ff' : ''; });
  };
  btns.brush.addEventListener('click', () => pick('brush'));
  btns.eraser.addEventListener('click', () => pick('eraser'));
  btns.fill.addEventListener('click', () => pick('fill'));
  btns.clear.addEventListener('click', () => { cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cv.width, cv.height); });
  btns.save.addEventListener('click', () => {
    cv.toBlob(blob => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'happey-paint.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }, 'image/png');
  });
  const col = b.querySelector('input[type=color]'), rng = b.querySelector('input[type=range]');
  col.addEventListener('input', () => { color = col.value; if (tool === 'eraser') pick('brush'); });
  rng.addEventListener('input', () => { size = +rng.value || 1; });
  const pos = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  };
  const stroke = (a, c) => {
    cx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
    cx.lineWidth = size; cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(c.x, c.y); cx.stroke();
  };
  function flood(sx, sy){
    const W = cv.width, H = cv.height;
    if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
    const img = cx.getImageData(0, 0, W, H), d = img.data;
    const fr = parseInt(color.slice(1, 3), 16), fg = parseInt(color.slice(3, 5), 16), fb = parseInt(color.slice(5, 7), 16);
    const si = (sy * W + sx) * 4;
    const tr = d[si], tg = d[si + 1], tb = d[si + 2], ta = d[si + 3];
    if (Math.abs(tr - fr) < 4 && Math.abs(tg - fg) < 4 && Math.abs(tb - fb) < 4 && ta === 255) return;
    const match = i => Math.abs(d[i] - tr) < 32 && Math.abs(d[i + 1] - tg) < 32 && Math.abs(d[i + 2] - tb) < 32 && Math.abs(d[i + 3] - ta) < 32;
    const stack = [[sx, sy]];
    while (stack.length){
      const top = stack.pop(), x = top[0], y = top[1];
      let l = x;
      while (l >= 0 && match((y * W + l) * 4)) l--;
      l++;
      let r = x;
      while (r < W && match((y * W + r) * 4)) r++;
      r--;
      for (let i = l; i <= r; i++){
        const o = (y * W + i) * 4;
        d[o] = fr; d[o + 1] = fg; d[o + 2] = fb; d[o + 3] = 255;
      }
      for (let yy = y - 1; yy <= y + 1; yy += 2){
        if (yy < 0 || yy >= H) continue;
        let i = l;
        while (i <= r){
          if (match((yy * W + i) * 4)){ stack.push([i, yy]); while (i <= r && match((yy * W + i) * 4)) i++; }
          else i++;
        }
      }
    }
    cx.putImageData(img, 0, 0);
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    const p = pos(e);
    if (tool === 'fill'){ flood(p.x | 0, p.y | 0); return; }
    drawing = true; last = p;
    stroke(p, { x: p.x + 0.1, y: p.y + 0.1 });
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    stroke(last, p); last = p;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => { drawing = false; }));
  pick('brush');
}
